<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="Resultado de partida de Deconocimiento Bíblico">
<title>Resultado · Deconocimiento Bíblico</title>
<style>
:root{
  --noche:#030914;--azul:#061a33;--azul2:#0a2a52;--cyan:#27c7ff;
  --cyan2:#8be6ff;--oro:#ffd166;--oro2:#f0a800;--verde:#39e39b;
  --rojo:#ff6070;--texto:#f5fbff;--tenue:#9bb4ca;--panel:rgba(7,25,48,.86);
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--texto)}
body{
  min-height:100vh;overflow-x:hidden;
  background:
    repeating-conic-gradient(from 0deg at 50% 20%,rgba(80,190,255,.045) 0 3deg,transparent 3deg 11deg),
    radial-gradient(800px 500px at 50% 8%,rgba(40,150,230,.28),transparent 70%),
    radial-gradient(700px 400px at 50% 105%,rgba(240,168,0,.13),transparent 70%),
    repeating-linear-gradient(0deg,rgba(100,190,255,.035) 0 1px,transparent 1px 42px),
    repeating-linear-gradient(90deg,rgba(100,190,255,.035) 0 1px,transparent 1px 42px),
    linear-gradient(145deg,#0a2a52 0%,#061a33 48%,#030914 100%);
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 45%,rgba(0,0,0,.5) 100%)}
.wrap{width:min(920px,calc(100% - 28px));margin:0 auto;padding:34px 0 45px;position:relative}
.brand{text-align:center;margin-bottom:18px}.brand h1 span{display:block}.brand h1 span+span{margin-top:2px}.brand .small{font-size:11px;font-weight:900;letter-spacing:4px;color:var(--cyan2);text-transform:uppercase}.brand h1{margin:5px 0 0;font-size:clamp(25px,5vw,48px);font-weight:950;letter-spacing:1px;text-transform:uppercase;text-shadow:0 0 22px rgba(39,199,255,.32)}
.card{position:relative;overflow:hidden;border:1px solid rgba(80,200,255,.38);border-radius:25px;background:linear-gradient(145deg,rgba(12,43,78,.96),rgba(3,14,29,.97));box-shadow:0 25px 80px rgba(0,0,0,.5),0 0 45px rgba(39,199,255,.08),inset 0 1px rgba(255,255,255,.08);padding:30px}
.card:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.045) 50%,transparent 80%);transform:translateX(-80%);animation:sweep 7s ease-in-out infinite}@keyframes sweep{55%,100%{transform:translateX(80%)}}
.ribbon{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--oro);font-size:12px;font-weight:950;letter-spacing:3px;text-transform:uppercase}.ribbon:before,.ribbon:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(255,209,102,.55))}.ribbon:after{background:linear-gradient(90deg,rgba(255,209,102,.55),transparent)}
.hero{text-align:center;padding:18px 0 22px}.hero .player{font-size:clamp(22px,5vw,40px);font-weight:950;text-transform:uppercase;letter-spacing:1px}.hero .score{font-size:clamp(55px,12vw,104px);line-height:.94;margin:10px 0 3px;font-weight:1000;color:var(--oro);letter-spacing:-2px;text-shadow:0 0 28px rgba(255,209,102,.35)}.hero .score-label{font-size:11px;font-weight:900;letter-spacing:4px;color:var(--tenue);text-transform:uppercase}
.badge{display:inline-flex;align-items:center;gap:7px;margin-top:15px;padding:8px 14px;border:1px solid rgba(39,199,255,.35);border-radius:999px;background:rgba(39,199,255,.08);color:var(--cyan2);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:4px 0 22px}.stat{border:1px solid rgba(130,190,230,.16);border-radius:16px;padding:16px 10px;text-align:center;background:rgba(255,255,255,.035)}.stat .n{font-size:clamp(25px,5vw,40px);font-weight:950;line-height:1;color:#fff}.stat .l{margin-top:6px;font-size:10px;font-weight:900;letter-spacing:1.8px;color:var(--tenue);text-transform:uppercase}.stat.gold .n{color:var(--oro)}.stat.green .n{color:var(--verde)}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:4px 0 23px}.chip{padding:8px 11px;border-radius:9px;background:rgba(0,0,0,.2);border:1px solid rgba(140,190,230,.15);color:#d9ebf7;font-size:11px;font-weight:800}.chip b{color:var(--cyan2)}
.status{display:flex;justify-content:center;align-items:center;gap:8px;color:var(--verde);font-weight:900;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}.dot{width:8px;height:8px;border-radius:50%;background:var(--verde);box-shadow:0 0 13px var(--verde)}
.duel-head{text-align:center;color:var(--oro);font-weight:950;letter-spacing:3px;font-size:12px;text-transform:uppercase;margin-bottom:15px}.versus{display:grid;grid-template-columns:1fr 80px 1fr;gap:12px;align-items:center}.player-card{border:1px solid rgba(80,200,255,.2);border-radius:17px;padding:18px 12px;text-align:center;background:rgba(255,255,255,.035)}.player-card.winner{border-color:rgba(255,209,102,.55);box-shadow:0 0 26px rgba(255,209,102,.1)}.player-card .name{font-weight:950;font-size:18px;text-transform:uppercase}.player-card .pts{font-weight:1000;font-size:36px;color:var(--oro);margin:7px 0}.player-card .small{font-size:10px;color:var(--tenue);font-weight:800}.vs{font-weight:1000;font-size:21px;color:var(--cyan);text-align:center;text-shadow:0 0 16px rgba(39,199,255,.55)}.winner-label{display:inline-block;margin-top:10px;color:var(--oro);font-size:10px;font-weight:950;letter-spacing:1.5px;text-transform:uppercase}
.share{margin-top:24px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{appearance:none;border:0;border-radius:12px;padding:13px 18px;font:900 12px Inter,Segoe UI,Arial;letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:#06101c;background:linear-gradient(135deg,#8be6ff,#27c7ff);box-shadow:0 7px 22px rgba(39,199,255,.18)}.btn.alt{color:#f5fbff;background:rgba(255,255,255,.06);border:1px solid rgba(150,200,230,.2);box-shadow:none}.btn:active{transform:translateY(1px)}
.result-highlight{margin:25px auto 0;max-width:720px;padding:17px 22px;border:1px solid rgba(39,199,255,.28);border-radius:15px;background:linear-gradient(135deg,rgba(39,199,255,.07),rgba(255,209,102,.045));box-shadow:inset 0 1px rgba(255,255,255,.04)}.result-highlight .rh-title{font-size:11px;font-weight:950;letter-spacing:2.2px;text-transform:uppercase;color:var(--cyan2);margin-bottom:7px}.result-highlight .rh-text{font-size:13px;line-height:1.45;font-weight:800;color:#d9ebf7}.result-highlight .rh-text b{color:var(--oro)}
.footer{text-align:center;margin-top:17px;color:#718ba2;font-size:10px;letter-spacing:1px}.error{text-align:center;padding:45px 10px}.error h2{margin:0 0 10px;color:var(--rojo)}.error p{color:var(--tenue)}
@media(max-width:620px){.wrap{width:min(100% - 16px,920px);padding-top:18px}.card{padding:21px 15px;border-radius:20px}.stats{gap:7px}.stat{padding:13px 5px}.versus{grid-template-columns:1fr;gap:8px}.vs{font-size:16px}.player-card .pts{font-size:31px}.share .btn{width:100%}.result-highlight{margin-top:22px;padding:15px 16px}.result-highlight .rh-text{font-size:12px}.brand h1{font-size:28px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
<main class="wrap">
  <header class="brand">
    <div class="small" id="brandSmall">Resultado de partida</div>
    <h1 id="brandTitle"><span>DECONOCIMIENTO</span><span>BÍBLICO</span></h1>
  </header>
  <section id="resultado" class="card"><div class="error"><h2>Cargando resultado…</h2><p>Preparando tu tarjeta de partida.</p></div></section>
  <div class="footer">RESULTADO GENERADO POR LA MÁQUINA ARCADE · DECONOCIMIENTO BÍBLICO</div>
</main>
<script>
(function(){
  'use strict';
  const $=s=>document.querySelector(s);
  const esc=s=>String(s==null?'':s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const num=n=>Number(n||0).toLocaleString('es-CO');
  function decode(){
    try{
      const raw=new URLSearchParams(location.search).get('d');
      if(!raw) return null;
      const b64=raw.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-raw.length%4)%4);
      const bin=atob(b64), bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
      const x=JSON.parse(new TextDecoder().decode(bytes));
      // Formato compacto actual del arcade.
      if(x && (x.v===1 || x.v===2) && typeof x.y==='number'){
        if(x.y===1){
          return {v:x.v,tipo:'duelo',fecha:x.t,titulo:x.i||'Deconocimiento Bíblico',iglesia:x.h||'',cat:x.c||'',modo:x.m||'',
            a:{nombre:x.a?.[0]||'Jugador 1',puntos:x.a?.[1]||0,aciertos:x.a?.[2]||0,respondidas:x.a?.[3]||0,racha:x.a?.[4]||0},
            b:{nombre:x.b?.[0]||'Jugador 2',puntos:x.b?.[1]||0,aciertos:x.b?.[2]||0,respondidas:x.b?.[3]||0,racha:x.b?.[4]||0},
            ganador:x.g||'',gana:(typeof x.w==='number'&&x.w>=0)?x.w:null,victorias:x.vics==null?null:x.vics};
        }
        return {v:x.v,tipo:'individual',fecha:x.t,titulo:x.i||'Deconocimiento Bíblico',iglesia:x.h||'',jugador:x.n||'Jugador',cat:x.c||'',
          puntos:x.p||0,aciertos:x.a||0,total:x.q||0,racha:x.r||0,rachaSemanas:x.s||0,puesto:x.u||null,nivel:x.l||'',
          completo:x.f===1,sinCreditos:x.f===2,continuados:x.k||0};
      }
      return x;
    }catch(e){console.error(e);return null}
  }
  function fecha(iso){try{return new Date(iso).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'})}catch(e){return ''}}
  async function imageCanvas(d){
    /* Imagen compartida: composición independiente, moderna y 9:16. */
    if(!window.html2canvas) throw new Error('Capturador no disponible');
    const stage=document.createElement('div');
    stage.style.cssText='position:fixed;left:-20000px;top:0;width:1080px;height:1920px;overflow:hidden;background:#020817;z-index:-1;';
    const escv=v=>esc(v);
    const parts=String(d.titulo||'DECOMNOCIMIENTO|BÍBLICO').split('|').map(v=>v.trim()).filter(Boolean);
    const title1=escv(parts[0]||'DECOMNOCIMIENTO');
    const title2=escv(parts[1]||'BÍBLICO');

    let content='';
    if(d.tipo==='duelo'){
      const aw=d.gana===0,bw=d.gana===1;
      const msg=d.ganador?('Defender la victoria de <b>'+escv(d.ganador)+'</b> en el próximo duelo.'):('Desempatar y conseguir la victoria en el próximo duelo.');
      content=`
        <div class="s-ribbon"><span>⚡</span> DUELO BÍBLICO</div>
        <div class="s-cat">${escv(d.cat||'DUELO BÍBLICO')}</div>
        <div class="s-duel">
          <div class="s-player ${aw?'win':''}"><div class="s-name">${escv(d.a.nombre)}</div><div class="s-pts">${num(d.a.puntos)}</div><div class="s-small">${escv(d.a.aciertos)} / ${escv(d.a.respondidas)} ACIERTOS</div>${aw?'<div class="s-winner">🏆 GANADOR</div>':''}</div>
          <div class="s-vs">VS</div>
          <div class="s-player ${bw?'win':''}"><div class="s-name">${escv(d.b.nombre)}</div><div class="s-pts">${num(d.b.puntos)}</div><div class="s-small">${escv(d.b.aciertos)} / ${escv(d.b.respondidas)} ACIERTOS</div>${bw?'<div class="s-winner">🏆 GANADOR</div>':''}</div>
        </div>
        <div class="s-result">${d.ganador?'🏆 '+escv(d.ganador):'EMPATE'}</div>
        <div class="s-info"><span>${escv(d.cat||'Duelo')}</span><span>${escv(fecha(d.fecha))}</span></div>
        <div class="s-challenge"><div>PRÓXIMO RETO</div><p>${msg}</p></div>`;
    }else{
      const estado=d.completo?'PARTIDA COMPLETADA':'PARTIDA FINALIZADA';
      const puesto=d.puesto?Number(d.puesto):null;
      let challenge='Sigue jugando para mejorar tu puntuación, tu racha y tu posición en el ranking.';
      if(puesto===1) challenge='¡Estás en el <b>primer puesto</b>! Defiende tu posición y supera tu mejor marca.';
      else if(puesto&&puesto>1) challenge='Tu próximo objetivo es alcanzar el <b>puesto #'+Math.max(1,puesto-1)+'</b> y superar tu mejor marca.';
      if(Number(d.rachaSemanas)>0) challenge+=' Racha semanal: <b>'+escv(d.rachaSemanas)+'</b>.';
      content=`
        <div class="s-ribbon"><span>🏆</span> RESULTADO INDIVIDUAL</div>
        <div class="s-player-name">${escv(d.jugador||'Jugador')}</div>
        <div class="s-score">${num(d.puntos)}</div>
        <div class="s-label">PUNTOS</div>
        <div class="s-level">★ &nbsp; ${escv(d.nivel||'Jugador')}</div>
        <div class="s-stats">
          <div class="s-stat green"><div class="s-stat-num">${escv(d.aciertos||0)} / ${escv(d.total||0)}</div><div class="s-stat-label">ACIERTOS</div></div>
          <div class="s-stat gold"><div class="s-stat-num">${escv(d.racha||0)}</div><div class="s-stat-label">MEJOR RACHA</div></div>
          <div class="s-stat"><div class="s-stat-num">${d.puesto?'#'+escv(d.puesto):'—'}</div><div class="s-stat-label">PUESTO</div></div>
        </div>
        <div class="s-meta"><div><small>CATEGORÍA</small><strong>${escv(d.cat||'')}</strong></div><div><small>ESTADO</small><strong>${escv(estado)}</strong></div></div>
        <div class="s-date">${escv(fecha(d.fecha))}</div>
        <div class="s-status"><span>●</span> RESULTADO REGISTRADO</div>
        <div class="s-challenge"><div>★ &nbsp; TU PRÓXIMO RETO</div><p>${challenge}</p></div>`;
    }

    stage.innerHTML=`<style>
      #shareCanvasRoot{width:1080px;height:1920px;position:relative;overflow:hidden;color:#f7fbff;font-family:Inter,Segoe UI,Arial,sans-serif;background:#020817}
      #shareCanvasRoot *{box-sizing:border-box}
      .s-bg1{position:absolute;inset:0;background:radial-gradient(700px 520px at 50% 8%,rgba(25,130,220,.25),transparent 68%),radial-gradient(650px 700px at 50% 70%,rgba(0,75,150,.13),transparent 70%),linear-gradient(160deg,#071b35 0%,#030b19 52%,#020611 100%)}
      .s-grid{position:absolute;inset:0;opacity:.32;background:linear-gradient(rgba(75,180,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(75,180,255,.045) 1px,transparent 1px);background-size:54px 54px;mask-image:linear-gradient(to bottom,black 0%,black 75%,transparent 100%)}
      .s-glow{position:absolute;width:700px;height:500px;left:190px;top:0;background:radial-gradient(ellipse,rgba(39,199,255,.13),transparent 67%);filter:blur(18px)}
      .s-frame{position:absolute;inset:24px;border:1px solid rgba(39,199,255,.45);border-radius:28px;box-shadow:0 0 35px rgba(39,199,255,.08),inset 0 0 60px rgba(39,199,255,.035)}
      .s-frame:before,.s-frame:after{content:"";position:absolute;background:#27c7ff;box-shadow:0 0 14px #27c7ff}.s-frame:before{width:170px;height:2px;top:-1px;left:54px}.s-frame:after{width:110px;height:2px;bottom:-1px;right:54px}
      .s-top{position:absolute;top:72px;left:55px;right:55px;text-align:center}.s-church{font-size:17px;font-weight:950;letter-spacing:6px;color:#8be6ff;text-transform:uppercase}.s-rule{height:1px;margin:18px 170px 22px;background:linear-gradient(90deg,transparent,rgba(255,209,102,.5),transparent)}
      .s-title1,.s-title2{font-weight:1000;letter-spacing:1px;text-transform:uppercase;line-height:.95}.s-title1{font-size:65px;color:#f7fbff;text-shadow:0 0 22px rgba(255,255,255,.12)}.s-title2{font-size:67px;color:#ffd166;margin-top:11px;text-shadow:0 0 25px rgba(255,209,102,.2)}
      .s-accent{position:absolute;top:295px;left:50%;transform:translateX(-50%);width:460px;height:2px;background:linear-gradient(90deg,transparent,#27c7ff,#ffd166,#27c7ff,transparent);box-shadow:0 0 20px rgba(39,199,255,.35)}
      .s-card{position:absolute;left:42px;right:42px;top:345px;bottom:105px;border-radius:30px;border:1px solid rgba(71,190,255,.48);background:linear-gradient(150deg,rgba(9,34,62,.97),rgba(3,13,27,.985));box-shadow:0 24px 80px rgba(0,0,0,.48),0 0 40px rgba(39,199,255,.08),inset 0 1px rgba(255,255,255,.07);padding:42px 42px 38px;text-align:center}
      .s-card:before{content:"";position:absolute;inset:14px;border-radius:22px;border:1px solid rgba(39,199,255,.08);pointer-events:none}.s-card:after{content:"";position:absolute;left:0;right:0;top:0;height:150px;background:linear-gradient(180deg,rgba(39,199,255,.06),transparent);pointer-events:none}
      .s-ribbon{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:12px;color:#ffd166;font-size:23px;font-weight:1000;letter-spacing:4px;margin-bottom:34px}.s-ribbon:before,.s-ribbon:after{content:"";width:115px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,209,102,.55))}.s-ribbon:after{background:linear-gradient(90deg,rgba(255,209,102,.55),transparent)}
      .s-player-name{position:relative;z-index:1;font-size:55px;font-weight:1000;letter-spacing:.5px;text-transform:uppercase}.s-score{position:relative;z-index:1;font-size:155px;line-height:.85;margin-top:18px;font-weight:1000;color:#ffd166;letter-spacing:-4px;text-shadow:0 0 32px rgba(255,209,102,.28)}.s-label{font-size:17px;font-weight:900;letter-spacing:7px;color:#9bb4ca;margin-top:7px}.s-level{display:inline-flex;position:relative;z-index:1;margin-top:28px;padding:13px 30px;border:1px solid rgba(39,199,255,.55);border-radius:999px;background:rgba(39,199,255,.07);color:#8be6ff;font-size:20px;font-weight:950;letter-spacing:1.5px}
      .s-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}.s-stat{height:155px;border-radius:20px;border:1px solid rgba(100,175,220,.22);background:rgba(255,255,255,.025);display:flex;flex-direction:column;align-items:center;justify-content:center}.s-stat-num{font-size:48px;line-height:1;font-weight:1000;color:#f5fbff}.s-stat.green .s-stat-num{color:#39e39b}.s-stat.gold .s-stat-num{color:#ffd166}.s-stat-label{font-size:13px;font-weight:900;letter-spacing:2px;color:#9bb4ca;margin-top:12px}
      .s-meta{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-top:30px}.s-meta>div{padding:17px 18px;text-align:left;border-radius:14px;background:rgba(1,10,22,.55);border:1px solid rgba(100,175,220,.16)}.s-meta small{display:block;font-size:10px;letter-spacing:2px;color:#718ba2;font-weight:900;margin-bottom:6px}.s-meta strong{display:block;font-size:17px;color:#8be6ff;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.s-meta>div:last-child strong{color:#eaf5fb}.s-date{display:inline-block;margin-top:18px;padding:12px 22px;border-radius:11px;background:rgba(255,255,255,.035);border:1px solid rgba(100,175,220,.15);font-size:15px;font-weight:850;color:#d8e8f3}.s-status{margin:24px auto 0;padding:16px 24px;border-radius:14px;background:rgba(57,227,155,.055);border:1px solid rgba(57,227,155,.42);color:#39e39b;font-size:19px;font-weight:1000;letter-spacing:2px}.s-status span{font-size:14px;margin-right:5px}
      .s-challenge{margin:27px auto 0;padding:20px 25px;border-radius:16px;background:linear-gradient(135deg,rgba(39,199,255,.07),rgba(255,209,102,.045));border:1px solid rgba(39,199,255,.20);max-width:850px}.s-challenge div{font-size:12px;font-weight:1000;letter-spacing:2.5px;color:#8be6ff}.s-challenge p{font-size:15px;line-height:1.4;font-weight:750;color:#d9e8f2;margin:9px 0 0}.s-challenge b{color:#ffd166}
      .s-footer{position:absolute;bottom:55px;left:50px;right:50px;text-align:center;color:#607a92;font-size:10px;font-weight:800;letter-spacing:2px}
      .s-cat{font-size:18px;color:#8be6ff;font-weight:900;letter-spacing:2px}.s-duel{display:grid;grid-template-columns:1fr 80px 1fr;gap:16px;align-items:center;margin-top:75px}.s-player{padding:32px 20px;border-radius:20px;border:1px solid rgba(39,199,255,.25);background:rgba(255,255,255,.025)}.s-player.win{border-color:rgba(255,209,102,.65);box-shadow:0 0 28px rgba(255,209,102,.10)}.s-name{font-size:30px;font-weight:1000;text-transform:uppercase}.s-pts{font-size:76px;font-weight:1000;color:#ffd166;margin:10px 0}.s-small{font-size:13px;color:#9bb4ca;font-weight:850}.s-winner{margin-top:13px;color:#ffd166;font-size:12px;font-weight:1000;letter-spacing:2px}.s-vs{font-size:30px;font-weight:1000;color:#27c7ff;text-shadow:0 0 18px rgba(39,199,255,.65)}.s-result{margin-top:45px;font-size:28px;font-weight:1000;color:#ffd166}.s-info{display:flex;justify-content:center;gap:12px;margin-top:35px}.s-info span{padding:12px 18px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid rgba(100,175,220,.16);font-size:14px;font-weight:850}.s-challenge{position:relative}
    </style>
    <div id="shareCanvasRoot">
      <div class="s-bg1"></div><div class="s-grid"></div><div class="s-glow"></div><div class="s-frame"></div>
      <div class="s-top"><div class="s-church">${escv(d.iglesia||'RESULTADO DE PARTIDA')}</div><div class="s-rule"></div><div class="s-title1">${title1}</div><div class="s-title2">${title2}</div></div>
      <div class="s-accent"></div>
      <section class="s-card">${content}</section>
      <div class="s-footer">RESULTADO GENERADO POR LA MÁQUINA ARCADE · DECONOCIMIENTO BÍBLICO</div>
    </div>`;
    document.body.appendChild(stage);
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const rendered=await html2canvas(stage.querySelector('#shareCanvasRoot'),{width:1080,height:1920,windowWidth:1080,windowHeight:1920,scale:1,backgroundColor:'#020817',useCORS:true,allowTaint:false,logging:false,scrollX:0,scrollY:0});
    stage.remove();
    return rendered;
  }
  async function share(){
    try{
      const c=await imageCanvas(d);
      const blob=await new Promise(r=>c.toBlob(r,'image/png',.95));
    if(!blob){copyLink();return}
    const file=new File([blob],'resultado-deconocimiento-9x16.png',{type:'image/png'});
    const link=location.href;
    const text='Mi resultado de partida · '+(d.iglesia||'')+'\n'+link;
    if(navigator.share){
      try{
        // Una sola acción: imagen + enlace en el mismo contenido compartido.
        if(!navigator.canShare || navigator.canShare({files:[file]})){
          await navigator.share({title:(d.titulo||'DECOMNOCIMIENTO BÍBLICO')+' · '+(d.iglesia||''),text,files:[file]});
          return;
        }
        await navigator.share({title:(d.titulo||'DECOMNOCIMIENTO BÍBLICO')+' · '+(d.iglesia||''),text});
        return;
      }catch(e){if(e&&e.name==='AbortError')return}
    }
    // En navegadores sin Web Share, entrega la imagen y copia el enlace como respaldo.
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='resultado-deconocimiento-9x16.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
      copyLink();
    }catch(err){
      console.error('Compartir resultado:',err);
      alert('No se pudo preparar la imagen para compartir. Intenta nuevamente.');
    }
  }
  function copyLink(){
    navigator.clipboard?.writeText(location.href).then(()=>alert('La imagen se guardó y el enlace quedó copiado.')).catch(()=>window.prompt('Copia este enlace:',location.href));
  }
  function stat(n,l,cls){return '<div class="stat '+(cls||'')+'"><div class="n">'+esc(n)+'</div><div class="l">'+esc(l)+'</div></div>'}
  function renderIndividual(d){
    const estado=d.completo?'PARTIDA COMPLETADA':(d.sinCreditos?'PARTIDA FINALIZADA':'PARTIDA FINALIZADA');
    return '<div class="ribbon">🏆 Resultado individual</div>'+
      '<div class="hero"><div class="player">'+esc(d.jugador||'Jugador')+'</div><div class="score">'+num(d.puntos)+'</div><div class="score-label">Puntos</div><div class="badge">★ '+esc(d.nivel||'Jugador')+'</div></div>'+
      '<div class="stats">'+stat((d.aciertos||0)+' / '+(d.total||0),'Aciertos','green')+stat(d.racha||0,'Mejor racha','gold')+stat(d.puesto?'#'+d.puesto:'—','Puesto')+'</div>'+
      '<div class="meta">'+(d.cat?'<span class="chip">Categoría: <b>'+esc(d.cat)+'</b></span>':'')+'<span class="chip">'+esc(estado)+'</span><span class="chip">'+esc(fecha(d.fecha))+'</span></div>'+
      '<div class="status"><span class="dot"></span> Resultado registrado</div>'+buttons();
  }
  function pc(p,win){return '<div class="player-card '+(win?'winner':'')+'"><div class="name">'+esc(p.nombre)+'</div><div class="pts">'+num(p.puntos)+'</div><div class="small">'+esc(p.aciertos)+' / '+esc(p.respondidas)+' aciertos · racha '+esc(p.racha)+'</div>'+(win?'<div class="winner-label">🏆 Ganador</div>':'')+'</div>'}
  function renderDuel(d){
    const aw=d.gana===0,bw=d.gana===1;
    return '<div class="duel-head">⚡ Duelo bíblico</div>'+
      '<div class="hero" style="padding-top:0"><div class="badge">'+esc(d.cat||'Duelo')+'</div></div>'+
      '<div class="versus">'+pc(d.a,aw)+'<div class="vs">VS</div>'+pc(d.b,bw)+'</div>'+
      '<div class="hero" style="padding:22px 0 4px"><div class="badge">'+(d.ganador?'🏆 Ganador: '+esc(d.ganador):'EMPATE')+'</div></div>'+
      '<div class="meta">'+(d.modo?'<span class="chip">Modo: <b>'+esc(d.modo)+'</b></span>':'')+(d.victorias!=null?'<span class="chip">Victorias: <b>'+esc(d.victorias)+'</b></span>':'')+'<span class="chip">'+esc(fecha(d.fecha))+'</span></div>'+buttons();
  }
  function buttons(){return '<div class="share"><button class="btn" id="share">↗ Compartir resultado · imagen + enlace</button></div>'}

  const d=decode(),host=$('#resultado');
  if(!d){host.innerHTML='<div class="error"><h2>Resultado no disponible</h2><p>El enlace no contiene una partida válida o está incompleto.</p></div>';return}
  const bt=$('#brandTitle'); if(bt){ const parts=String(d.titulo||'DECOMNOCIMIENTO|BÍBLICO').split('|').map(v=>v.trim()).filter(Boolean); bt.innerHTML='<span>'+esc(parts[0]||'DECOMNOCIMIENTO')+'</span><span>'+esc(parts[1]||'BÍBLICO')+'</span>'; }
  const bs=$('#brandSmall'); if(bs) bs.textContent=d.iglesia||'Resultado de partida';
  document.title=(d.titulo||'Deconocimiento Bíblico')+' · '+(d.iglesia||'Resultado');
  host.innerHTML=d.tipo==='duelo'?renderDuel(d):renderIndividual(d);
  $('#share').onclick=share;
  const shareBtn=$('#share'); if(shareBtn) shareBtn.onclick=share;
})();
</script>
</body>
</html>
